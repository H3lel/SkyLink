[package]
name = "nthlink"
version.workspace = true
edition.workspace = true
description = "nthLink client for Linux (GTK4 front end + headless CLI)"

[[bin]]
name = "nthlink"
path = "src/main.rs"

[dependencies]
nthlink-common = { path = "../common" }
gtk = { package = "gtk4", version = "0.11" }
async-channel = "2"
libc = "0.2"
serde_json = "1"
